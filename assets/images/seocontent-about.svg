  <circle cx="444" cy="256" r="20" fill="#8b5cf6" opacity="0.2"/>
  <text x="444" y="261" text-anchor="middle" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="14" font-weight="600">n8</text>
  <text x="474" y="252" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Automation Pipeline</text>
