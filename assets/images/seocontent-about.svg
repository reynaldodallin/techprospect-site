    <circle cx="185" cy="180" r="3" fill="#4F46E5"/><circle cx="195" cy="190" r="3" fill="#4F46E5"/>
    <circle cx="210" cy="200" r="3" fill="#4F46E5"/><circle cx="220" cy="220" r="3" fill="#4F46E5"/>
