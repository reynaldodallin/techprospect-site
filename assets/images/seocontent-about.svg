  <text x="444" y="201" text-anchor="middle" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="14" font-weight="600">AI</text>
  <text x="474" y="192" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12" font-weight="600">AI Engine v4.0</text>
  <text x="474" y="208" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">Content Generation Core</text>
  
