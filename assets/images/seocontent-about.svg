  <text x="474" y="132" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Reynaldo Dallin</text>
  <text x="474" y="148" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">Founder &amp; CEO</text>
  
