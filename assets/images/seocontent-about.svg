  <text x="252" y="278" text-anchor="middle" fill="#fcd34d" font-family="system-ui,sans-serif" font-size="10">n8n</text>
  <rect x="288" y="262" width="76" height="24" rx="12" fill="#22c55e" opacity="0.12"/>
